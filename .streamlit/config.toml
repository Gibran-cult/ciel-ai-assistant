[theme]
# Keep in step with the dark --c-* tokens in CIEL_CSS (app.py): dark is the
# default theme, so Streamlit's own first paint must already be dark.
base = "dark"
primaryColor = "#9db3e8"
backgroundColor = "#0e0d0c"
secondaryBackgroundColor = "#181715"
textColor = "#f4f4f2"

[server]
# MB per file. Images are capped at 5 MB and text at 40,000 characters in
# app.py; this stops oversized uploads before the app reads them.
maxUploadSize = 25
