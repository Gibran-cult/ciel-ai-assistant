# Ciel's backend on one VPS. Run from this directory (/opt/ciel/deploy/vps):
# Compose reads the secrets from the .env next to this file (see .env.example).
#
#   internet -> caddy (TLS) -> nginx (Basic Auth, allowlist, rate limit) -> langflow
#            -> caddy (TLS) -> agent, agent-staging (Ciel Agent API, own login and tokens)
#                                                                           postgres
#                                                                           ollama (shares langflow's network)
#
# Only caddy is public. Langflow is reachable on the VPS itself at 127.0.0.1:7860
# (for the SSH tunnel to the Langflow UI and for the backup/retention scripts).
services:
  caddy:
    image: caddy:2.8.4
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - nginx

  # The config is generated by tools/render_nginx_gateway.py from the same
  # allowlist as the ngrok policy. Its upstream names `langflow` with the
  # `resolve` flag, so nginx asks Docker's DNS again every 10 seconds and
  # follows Langflow to a new address without a restart.
  nginx:
    image: nginx:1.27.3-alpine
    restart: unless-stopped
    volumes:
      - ./nginx/ciel.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ciel.htpasswd:/etc/nginx/ciel.htpasswd:ro
    depends_on:
      - langflow

  langflow:
    image: langflowai/langflow:1.12.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:7860:7860"
    environment:
      LANGFLOW_DATABASE_URL: "postgresql://langflow:${POSTGRES_PASSWORD}@postgres:5432/langflow"
      LANGFLOW_WORKERS: "1"
      LANGFLOW_AUTO_LOGIN: "false"
      LANGFLOW_SUPERUSER: "${LANGFLOW_SUPERUSER}"
      LANGFLOW_SUPERUSER_PASSWORD: "${LANGFLOW_SUPERUSER_PASSWORD}"
      LANGFLOW_SECRET_KEY: "${LANGFLOW_SECRET_KEY}"
      LANGFLOW_VERTEX_BUILDS_STORAGE_ENABLED: "false"
      LANGFLOW_HOST: "0.0.0.0"
      LANGFLOW_PORT: "7860"
    volumes:
      - langflow_home:/app/data
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: "langflow"
      POSTGRES_DB: "langflow"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "langflow", "-d", "langflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Shares langflow's network namespace, so the flow components' hard-coded
  # http://127.0.0.1:11434 reaches this Ollama. It publishes no ports itself.
  ollama:
    image: ollama/ollama:0.40.10
    restart: unless-stopped
    network_mode: "service:langflow"
    volumes:
      - ollama_models:/root/.ollama
    # A langflow restart replaces the network namespace this container is
    # attached to; restart: true restarts ollama with it. ollama_link_check.sh
    # (cron, see README) catches the cases Compose does not, e.g. an OOM kill
    # restarted by the Docker daemon.
    depends_on:
      langflow:
        condition: service_started
        restart: true

  # Ciel Agent API (docs/plans/2026-11-18-agent-service.md) and its staging
  # copy with its own keys and database. No ports: only Caddy reaches :8000.
  # Kill switch for running tasks: docker compose exec agent touch /data/agent_off
  agent:
    build:
      context: ../..
      dockerfile: deploy/vps/agent.Dockerfile
    restart: unless-stopped
    env_file: agent.env
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - agent_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  agent-staging:
    build:
      context: ../..
      dockerfile: deploy/vps/agent.Dockerfile
    restart: unless-stopped
    env_file: agent-staging.env
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - agent_staging_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  langflow_home:
  postgres_data:
  ollama_models:
  caddy_data:
  agent_data:
  agent_staging_data:
