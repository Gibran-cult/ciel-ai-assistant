# Ciel's backend on one VPS. Run from this directory (/opt/ciel/deploy/vps):
# Compose reads the secrets from the .env next to this file (see .env.example).
#
#   internet -> caddy (TLS) -> nginx (Basic Auth, allowlist, rate limit) -> langflow
#                                                                           postgres
#                                                                           ollama (shares langflow's network)
#
# Only caddy is public. Langflow is reachable on the VPS itself at 127.0.0.1:7860
# (for the SSH tunnel to the Langflow UI and for the backup/retention scripts).
services:
  caddy:
    image: caddy:2.8.4
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - nginx

  # The config is generated by tools/render_nginx_gateway.py from the same
  # allowlist as the ngrok policy. It names `langflow` as an upstream, which
  # nginx resolves once at start: restart nginx after Langflow is recreated.
  nginx:
    image: nginx:1.27.3-alpine
    restart: unless-stopped
    volumes:
      - ./nginx/ciel.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ciel.htpasswd:/etc/nginx/ciel.htpasswd:ro
    depends_on:
      - langflow

  langflow:
    image: langflowai/langflow:1.12.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:7860:7860"
    environment:
      LANGFLOW_DATABASE_URL: "postgresql://langflow:${POSTGRES_PASSWORD}@postgres:5432/langflow"
      LANGFLOW_WORKERS: "1"
      LANGFLOW_AUTO_LOGIN: "false"
      LANGFLOW_SUPERUSER: "${LANGFLOW_SUPERUSER}"
      LANGFLOW_SUPERUSER_PASSWORD: "${LANGFLOW_SUPERUSER_PASSWORD}"
      LANGFLOW_SECRET_KEY: "${LANGFLOW_SECRET_KEY}"
      LANGFLOW_VERTEX_BUILDS_STORAGE_ENABLED: "false"
      LANGFLOW_HOST: "0.0.0.0"
      LANGFLOW_PORT: "7860"
    volumes:
      - langflow_home:/app/data
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: "langflow"
      POSTGRES_DB: "langflow"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "langflow", "-d", "langflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Shares langflow's network namespace, so the flow components' hard-coded
  # http://127.0.0.1:11434 reaches this Ollama. It publishes no ports itself.
  ollama:
    image: ollama/ollama:0.40.10
    restart: unless-stopped
    network_mode: "service:langflow"
    volumes:
      - ollama_models:/root/.ollama
    depends_on:
      - langflow

volumes:
  langflow_home:
  postgres_data:
  ollama_models:
  caddy_data:
