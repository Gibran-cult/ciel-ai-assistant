name: CIEL AI MASTER CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ciel-ai-master-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests chromadb

      - name: Validate flow JSON
        run: |
          python -m json.tool flow/v1.0.0/Ciel_AI_Long-Term_Memory_Master.json > /dev/null
          python -m json.tool flow/v1.1.0/Ciel_AI_Long-Term_Memory_Master.json > /dev/null

      - name: Run unittest suite
        run: python -m unittest discover -v tests
