name: CIEL AI MASTER CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ciel-ai-master-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests chromadb "streamlit>=1.45"

      - name: Validate flow JSON
        run: |
          python -m json.tool flow/v1.0.0/Ciel_AI_Long-Term_Memory_Master.json > /dev/null
          python -m json.tool flow/v1.1.0/Ciel_AI_Long-Term_Memory_Master.json > /dev/null
          python -m json.tool flow/v1.2.0/Ciel_AI_Long-Term_Memory_Master.json > /dev/null
          python -m json.tool flow/v1.3.0/Ciel_AI_Long-Term_Memory_Master.json > /dev/null
          python -m json.tool flow/v1.4.0/Ciel_AI_Long-Term_Memory_Master.json > /dev/null
          python -m json.tool flow/v1.4.1/Ciel_AI_Long-Term_Memory_Master.json > /dev/null
          python -m json.tool flow/v1.5.0/Ciel_AI_Long-Term_Memory_Master.json > /dev/null
          python -m json.tool flow/v1.5.1/Ciel_AI_Long-Term_Memory_Master.json > /dev/null

      - name: Run offline test suite
        run: |
          python -m unittest -v \
            tests.test_memory_v110_contract \
            tests.test_flow_v120_contract \
            tests.test_flow_v130_contract \
            tests.test_flow_v140_contract \
            tests.test_flow_v141_contract \
            tests.test_flow_v150_contract \
            tests.test_flow_v151_contract \
            tests.test_resilience \
            tests.test_rate_limit \
            tests.test_project_context \
            tests.test_live_scripts \
            tests.test_app_hygiene \
            tests.test_performance_snapshot \
            tests.test_pricing
