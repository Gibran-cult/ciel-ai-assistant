name: CIEL AI MASTER CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ciel-ai-master-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests python-dotenv chromadb "streamlit>=1.45" "pypdf>=6" "python-docx>=1.1"

      # TEMPORARY (2026-10-24, Ciel's decision): the Pillow 12.3.0 advisories
      # below are fixed only in Pillow 13.0.0, which no Streamlit release
      # allows yet (streamlit requires pillow<13) and which needs Python 3.11+.
      # Remove PILLOW_IGNORED, and raise the Python version if needed, as
      # soon as Streamlit accepts Pillow 13. Only these IDs are skipped; any
      # other advisory, including a new one for Pillow, still fails the build.
      - name: Audit app dependencies for known vulnerabilities
        env:
          PILLOW_IGNORED: >-
            CVE-2026-112390 CVE-2026-112391 CVE-2026-112392 CVE-2026-112393
            CVE-2026-112395 CVE-2026-112396 CVE-2026-112397 CVE-2026-112398
            CVE-2026-112399 CVE-2026-112400 CVE-2026-112401 CVE-2026-112402
            CVE-2026-112404 CVE-2026-112405 CVE-2026-112406 CVE-2026-112891
            CVE-2026-112892 CVE-2026-112893 CVE-2026-112894 CVE-2026-112895
            CVE-2026-112896 CVE-2026-112897 CVE-2026-112899 CVE-2026-112900
            CVE-2026-112901 CVE-2026-114501 CVE-2026-96636 CVE-2026-96637
            CVE-2026-96638 CVE-2026-96639 CVE-2026-96640 CVE-2026-96641
            CVE-2026-96642 CVE-2026-96643 CVE-2026-96644 CVE-2026-96778
            GHSA-78g4-xqwv-q3g8
        run: |
          python -m pip install pip-audit
          ignored=""
          for id in $PILLOW_IGNORED; do ignored="$ignored --ignore-vuln $id"; done
          pip-audit -r requirements.txt $ignored

      - name: Validate flow JSON
        run: |
          python -m json.tool flow/v1.0.0/Ciel_AI_Long-Term_Memory_Master.json > /dev/null
          python -m json.tool flow/v1.1.0/Ciel_AI_Long-Term_Memory_Master.json > /dev/null
          python -m json.tool flow/v1.2.0/Ciel_AI_Long-Term_Memory_Master.json > /dev/null
          python -m json.tool flow/v1.3.0/Ciel_AI_Long-Term_Memory_Master.json > /dev/null
          python -m json.tool flow/v1.4.0/Ciel_AI_Long-Term_Memory_Master.json > /dev/null
          python -m json.tool flow/v1.4.1/Ciel_AI_Long-Term_Memory_Master.json > /dev/null
          python -m json.tool flow/v1.5.0/Ciel_AI_Long-Term_Memory_Master.json > /dev/null
          python -m json.tool flow/v1.5.1/Ciel_AI_Long-Term_Memory_Master.json > /dev/null
          python -m json.tool flow/v1.6.0/Ciel_AI_Long-Term_Memory_Master.json > /dev/null
          python -m json.tool flow/v1.7.0/Ciel_AI_Long-Term_Memory_Master.json > /dev/null
          python -m json.tool flow/v1.8.0/Ciel_AI_Long-Term_Memory_Master.json > /dev/null
          python -m json.tool flow/v1.9.0/Ciel_AI_Long-Term_Memory_Master.json > /dev/null
          python -m json.tool flow/v1.10.0/Ciel_AI_Long-Term_Memory_Master.json > /dev/null
          python -m json.tool flow/v1.10.1/Ciel_AI_Long-Term_Memory_Master.json > /dev/null
          python -m json.tool flow/v1.10.2/Ciel_AI_Long-Term_Memory_Master.json > /dev/null
          python -m json.tool flow/v1.11.0/Ciel_AI_Long-Term_Memory_Master.json > /dev/null
          python -m json.tool flow/subflows/Web_Research_Assistant.json > /dev/null
          python -m json.tool flow/riset_skripsi/v1.0.0/Ciel_Riset_Skripsi.json > /dev/null
          python -m json.tool flow/riset_skripsi/v1.1.0/Ciel_Riset_Skripsi.json > /dev/null
          python -m json.tool flow/penulis/v1.0.0/Ciel_Penulis.json > /dev/null
          python -m json.tool flow/memory_admin/Ciel_Memory_Admin.json > /dev/null

      - name: Run offline test suite
        run: |
          python -m unittest -v \
            tests.test_memory_v110_contract \
            tests.test_flow_v120_contract \
            tests.test_flow_v130_contract \
            tests.test_flow_v140_contract \
            tests.test_flow_v141_contract \
            tests.test_flow_v150_contract \
            tests.test_flow_v151_contract \
            tests.test_flow_v160_contract \
            tests.test_ml_analyst \
            tests.test_flow_v170_contract \
            tests.test_flow_v180_contract \
            tests.test_flow_v190_contract \
            tests.test_flow_v1100_contract \
            tests.test_flow_v1101_contract \
            tests.test_flow_v1102_contract \
            tests.test_flow_v1110_contract \
            tests.test_flow_v1120_contract \
            tests.test_flow_riset_v100_contract \
            tests.test_flow_riset_v110_contract \
            tests.test_riset_components \
            tests.test_flow_penulis_v100_contract \
            tests.test_writing \
            tests.test_kerangka_app \
            tests.test_draft_check \
            tests.test_cek_kutipan_app \
            tests.test_gateway_policy \
            tests.test_app_security \
            tests.test_source_guard \
            tests.test_vision_images \
            tests.test_vision_router \
            tests.test_personal_datasets \
            tests.test_resilience \
            tests.test_rate_limit \
            tests.test_project_context \
            tests.test_live_scripts \
            tests.test_app_hygiene \
            tests.test_performance_snapshot \
            tests.test_pricing \
            tests.test_privacy \
            tests.test_login \
            tests.test_chat_store \
            tests.test_ciel_pro \
            tests.test_payments \
            tests.test_keep_alive \
            tests.test_theme \
            tests.test_chat_sources \
            tests.test_beranda \
            tests.test_beranda_app \
            tests.test_chat_view \
            tests.test_pdf_attachments

      # Node that comes with the runner (no extra setup): the Edge Function's
      # logic is plain JavaScript so it can be tested here too.
      - name: Run Edge Function tests
        run: node --test supabase/functions/midtrans-notify/notification.test.mjs
